name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm test
      - name: Check that the tag matches the manifest version
        run: |
          manifest="v$(node -p "require('./package.json').version")"
          if [ "$manifest" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $manifest" >&2
            exit 1
          fi
      - run: npx vsce package --out month-ai-usage-${{ github.ref_name }}.vsix
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: month-ai-usage-${{ github.ref_name }}.vsix
          generate_release_notes: true
      # Switch to OIDC trusted publishing once it is available: see NEXT_STEPS.md.
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --packagePath month-ai-usage-${{ github.ref_name }}.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
